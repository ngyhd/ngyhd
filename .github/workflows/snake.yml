name: Generate Snake

# 触发条件
on:
  # 定时触发：每 24 小时运行一次 (每天午夜)
  schedule:
    - cron: "0 0 * * *" 
  # 手动触发：允许你在 Actions 页面点击按钮手动运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v2

      # 2. 核心步骤：生成贪吃蛇 SVG
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ngyhd  # 你的用户名
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. 部署步骤：将生成的文件推送到 output 分支
      # 这一步非常巧妙，它不会把垃圾文件堆在你的 main 分支，
      # 而是自动创建一个叫 "output" 的分支专门存放生成的图片。
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
